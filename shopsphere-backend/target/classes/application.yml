spring:
  application:
    name: shopsphere-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shopsphere?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: root  
    password: admin
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

shopsphere:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
